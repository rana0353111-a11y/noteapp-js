<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Note App</title>
  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    .container{
      background-color: aqua;
      width: 100%;
      min-height: 100vh;
      padding: 20px;
    } 
    textarea{
      height: 150px;
      width: 100%;
      margin-bottom: 10px;
      padding: 10px;
      font-size: 16px;
    }
    button{
      padding: 8px 15px;
      margin-right: 10px;
      border: none;
      background: darkblue;
      color: white;
      cursor: pointer;
      border-radius: 5px;
    }
    .notes{
      margin-top: 20px;
    }
    .note{
      background: white;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <h1>NOTE-APP</h1>      
  <div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
      <h2>My Notes</h2>
      <div style="background: darkblue; color: white; padding: 8px 15px; border-radius: 5px; font-weight: bold;">
        Total Notes: <span id="note-counter">0</span>
      </div>
    </div>
    <textarea id="input-box" placeholder="write your note here..."></textarea>
    <button onClick="addNote()">Add Note</button>
    <button onClick="removeNotes()">Remove All Notes</button>
    <div class="notes" id="notes-list"></div>
  </div>

  <script>
    let notesList = document.getElementById("notes-list");
    let inputBox = document.getElementById("input-box");
    let noteCounter = document.getElementById("note-counter");

    function updateCounter(){
      let count = notesList.querySelectorAll(".note").length;
      noteCounter.textContent = count;
    }

    function addNote(){
      if(inputBox.value.trim() === ""){
        alert("Please write something before adding!");
        return;
      }
      let note = document.createElement("div");
      note.classList.add("note");
      note.textContent = inputBox.value;
      notesList.appendChild(note);
      inputBox.value = ""; // clear textarea
      updateCounter(); // update the counter
    }

    function removeNotes(){
      notesList.innerHTML = ""; // clears all notes
      updateCounter(); // update the counter
    }

    // Initialize counter on page load
    updateCounter();
  </script>

</body>
</html>
